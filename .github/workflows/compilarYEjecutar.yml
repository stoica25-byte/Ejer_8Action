name: action compilar java

on:
  push:

jobs:
  compilar_java:
    runs-on: ubuntu-latest
    steps:
      - name: descargarrepo
        uses: actions/checkout@v4

      - name: configurarjdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: compilarjava
        run: |
          javac src/main.java
          java -cp src main
              
          
      
      
